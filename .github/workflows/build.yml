name: Build Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
      - name: Build Windows app
        run: pyinstaller --clean --noconfirm Batch-o-mark.spec
      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Batch-o-mark/* -DestinationPath Batch-o-mark-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Batch-o-mark-windows-x64
          path: Batch-o-mark-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements-desktop.txt pyinstaller
      - name: Build macOS app
        run: pyinstaller --clean --noconfirm Batch-o-mark.spec
      - name: Package macOS DMG
        run: hdiutil create -volname "Batch-o-mark" -srcfolder dist/Batch-o-mark.app -ov -format UDZO Batch-o-mark-macos.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: Batch-o-mark-macos
          path: Batch-o-mark-macos.dmg
